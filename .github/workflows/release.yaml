---
name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds a snapshot, publishes nothing

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - name: Read the pinned GoReleaser version
        id: goreleaser
        # Renovate updates .github/goreleaser/Dockerfile; this keeps one place for the pin.
        run: |
          version="$(sed -n 's/^FROM goreleaser\/goreleaser:\(v[0-9][0-9.]*\).*/\1/p' .github/goreleaser/Dockerfile)"
          test -n "$version" || { echo "no GoReleaser version in .github/goreleaser/Dockerfile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.goreleaser.outputs.version }}
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean --skip=publish,sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
